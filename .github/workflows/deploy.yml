name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_ANON_KEY }}
          NUXT_SITE_URL: ${{ secrets.NUXT_SITE_URL }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files
        run: |
          rsync -az --delete \
            .output/ root@${{ secrets.DEPLOY_HOST }}:/opt/liberhack/.output/
          rsync -az \
            Dockerfile docker-compose.yml Caddyfile \
            root@${{ secrets.DEPLOY_HOST }}:/opt/liberhack/

      - name: Redeploy
        run: |
          ssh root@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -e
            cd /opt/liberhack
            docker network create liberhack 2>/dev/null || true
            docker compose up -d --build
            docker image prune -f
          EOF
